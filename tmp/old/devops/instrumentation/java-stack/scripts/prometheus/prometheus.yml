global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'member-app'
    metrics_path: '/metrics/prometheus'
    static_configs:
      - targets: ['member-app:7071']
  
  - job_name: 'course-app'
    metrics_path: '/metrics/prometheus'
    static_configs:
      - targets: ['course-app:7072']

  - job_name: 'booking-app'
    metrics_path: '/metrics/prometheus'
    static_configs:
      - targets: ['booking-app:7070']