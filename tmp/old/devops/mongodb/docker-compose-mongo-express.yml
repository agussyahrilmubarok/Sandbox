services:
  mongo-express:
    image: mongo-express:1.0-20-alpine3.19
    container_name: mongo-express
    restart: on-failure
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://sandbox:sandboxpass@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: sandbox
      ME_CONFIG_BASICAUTH_PASSWORD: sandboxpass
    ports:
      - "8081:8081"