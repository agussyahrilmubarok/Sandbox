definitions:
  booking.Booking:
    properties:
      booking_date:
        type: string
      course_code:
        type: string
      created_at:
        type: string
      id:
        type: string
      member_code:
        type: string
      notes:
        type: string
      status:
        $ref: '#/definitions/booking.BookingStatus'
      updated_at:
        type: string
    type: object
  booking.BookingRequest:
    properties:
      course_code:
        type: string
      member_code:
        type: string
    type: object
  booking.BookingStatus:
    enum:
    - 0
    - 1
    - 2
    type: integer
    x-enum-varnames:
    - BookingStatusPending
    - BookingStatusConfirmed
    - BookingStatusCancelled
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://www.example.com/support
  description: This is the Booking Service API.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://example.com/terms/
  title: Booking Service API
  version: "1.0"
paths:
  /api/v1/booking/course:
    post:
      consumes:
      - application/json
      description: Book a seat for a course by providing booking details
      parameters:
      - description: Booking Request
        in: body
        name: booking_request
        required: true
        schema:
          $ref: '#/definitions/booking.BookingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully booked the course
          schema:
            $ref: '#/definitions/booking.Booking'
        "400":
          description: Invalid request payload
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Book a course seat
      tags:
      - Booking
  /api/v2/booking/course:
    post:
      consumes:
      - application/json
      description: Book a seat for a course using goroutines (parallel processing)
      parameters:
      - description: Booking Request
        in: body
        name: booking_request
        required: true
        schema:
          $ref: '#/definitions/booking.BookingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully booked the course
          schema:
            $ref: '#/definitions/booking.Booking'
        "400":
          description: Invalid request payload
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Book a course seat (v2)
      tags:
      - Booking
swagger: "2.0"
