services:
  mysql:
    image: mysql:9.3
    container_name: mysql
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sandbox
      MYSQL_USER: sandboxuser
      MYSQL_PASSWORD: sandboxpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sandbox_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.2
    container_name: phpmyadmin
    restart: on-failure
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "5050:80"
    networks:
      - sandbox_net
    depends_on:
      - mysql

volumes:
  mysql_data:

networks:
  sandbox_net:
    driver: bridge
