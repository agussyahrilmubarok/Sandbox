services:
  postgres:
    image: postgres:17.6
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sandboxpass
      POSTGRES_DB: sandbox
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - sandbox_net

  pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: pgadmin
    restart: on-failure
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sandbox.com
      PGADMIN_DEFAULT_PASSWORD: sandboxpass
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - sandbox_net
    depends_on:
      - postgres

volumes:
  pg_data:
  pgadmin_data:

networks:
  sandbox_net:
    driver: bridge
