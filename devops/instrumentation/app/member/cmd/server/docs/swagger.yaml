paths:
  /members:
    get:
      description: Retrieves all member data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/member.Member'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all members
      tags:
      - Members
  /members/clean-dummy:
