server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: member-app
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/member_db}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD:my-secret-pw}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true

springdoc:
  pathsToMatch: /, /api/**