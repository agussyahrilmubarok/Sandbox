apiVersion: 1

providers:
  - name: 'Member App Dashboards'
    orgId: 1
    folder: 'member-app'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards/member-app

  - name: 'Course App Dashboards'
    orgId: 1
    folder: 'course-app'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards/course-app

  - name: 'Booking App Dashboards'
    orgId: 1
    folder: 'booking-app'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards/booking-app
