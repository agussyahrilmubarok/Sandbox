services:
  postgres:
    image: postgres:17.6
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my-secret-pw
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - instrument_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  consul:
    container_name: consul
    image: hashicorp/consul:1.9.9
    restart: unless-stopped
    command: agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    networks:
      - instrument_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/v1/status/leader"]
      interval: 10s
      retries: 5
      timeout: 5s
      start_period: 10s

  member-app:
    build: 
      context: ./app/member
    container_name: member-app
    restart: on-failure
    ports:
      - "8081:8081"
    volumes:
      - ./logging/member-app:/app/logs
    networks:
      - instrument_net
    depends_on:
      postgres:
        condition: service_healthy
  
  course-app:
    build: 
      context: ./app/course
    container_name: course-app
    restart: on-failure
    ports:
      - "8082:8082"
    volumes:
      - ./logging/course-app:/app/logs
    networks:
      - instrument_net
    depends_on:
      postgres:
        condition: service_healthy

  booking-app:
    build: 
      context: ./app/booking
    container_name: booking-app
    restart: on-failure
    ports:
      - "8080:8080"
    volumes:
      - ./logging/booking-app:/app/logs
    networks:
      - instrument_net
    depends_on:
      postgres:
        condition: service_healthy   
  
  grafana:
    image: grafana/grafana:12.2
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./scripts/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - instrument_net
    depends_on:
      - loki
  
  loki:
    image: grafana/loki:3.5.7
    container_name: loki
    restart: on-failure
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./scripts/loki:/etc/loki
    networks:
      - instrument_net
    depends_on:
      - member-app
      - course-app
      - booking-app
  
  fluentbit:
    image: fluent/fluent-bit:4.0
    container_name: fluentbit
    restart: on-failure
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./scripts/fluentbit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./scripts/fluentbit/map.json:/fluent-bit/etc/map.json
      - ./logging:/app/logs
    networks:
      - instrument_net
    depends_on:
      - loki

volumes:
  postgres_data:
  grafana_data:

networks:
  instrument_net:
    driver: bridge