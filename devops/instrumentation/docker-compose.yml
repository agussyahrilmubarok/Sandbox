services:
  postgres:
    image: postgres:17.6
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: my-secret-pw
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - instrument_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  consul:
    container_name: consul
    image: hashicorp/consul:1.9.9
    restart: unless-stopped
    command: agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    networks:
      - instrument_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/v1/status/leader"]
      interval: 10s
      retries: 5
      timeout: 5s
      start_period: 10s

  member-app:
    build: 
      context: ./app/member
    container_name: member-app
    restart: on-failure
    ports:
      - "8081:8081"
    networks:
      - instrument_net
    depends_on:
      postgres:
        condition: service_healthy
  
  course-app:
    build: 
      context: ./app/course
    container_name: course-app
    restart: on-failure
    ports:
      - "8082:8082"
    networks:
      - instrument_net
    depends_on:
      postgres:
        condition: service_healthy

  booking-app:
    build: 
      context: ./app/booking
    container_name: booking-app
    restart: on-failure
    ports:
      - "8080:8080"
    networks:
      - instrument_net
    depends_on:
      postgres:
        condition: service_healthy   

volumes:
  postgres_data:

networks:
  instrument_net:
    driver: bridge